<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="theme-color" content="#0a0a0a">

    <!-- Security Meta Tags -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet"
        media="print" onload="this.media='all'">

</head>

<body>

    <header class="site-header">
        <div class="header-content">
            <div class="brand-name">HAUSPIRE LUXURY DESIGN STUDIO</div>

                <a href="index.html" class="nav-btn">Videos</a>
                <a href="tel:7666645800" class="contact-btn">Call Us</a>

        </div>

    <main>
        <div id="masonry-grid" class="masonry-grid">

        </div>
        <div id="loader" class="loader">Loading gallery...</div>

    <!-- Lightbox Overlay -->

    </div>

    <script src="photos-script.js" defer></script>

</html>
